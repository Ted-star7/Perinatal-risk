repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff

  - repo: local
    hooks:
      - id: block-dhs-data
        name: block DHS data and raw datasets
        entry: Refusing commit — DHS/raw data files must never be committed.
        language: fail
        files: '\.(dta|sav|csv|zip|dat|DTA|SAV|CSV|ZIP|DAT)$'
        exclude: '^data/\.gitkeep$'
