name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Lint the Python we actually have. Backend/frontend checks come back when
# those stages are built out.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
