# API contract. The Angular client is generated from this, so frontend and
# backend can never drift. Keep it in sync with backend/app/schemas.py.
openapi: 3.0.3
info:
  title: Perinatal risk API
  version: 0.1.0
paths:
  /health:
    get:
      responses: { "200": { description: ok } }
  /predict:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PredictRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PredictResponse" }
  /recommend:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecommendRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendResponse" }
  /feedback:
    post:
      description: Clinician verdict on a recommendation (good / viable / unusable)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Feedback" }
      responses: { "200": { description: stored } }
  /eval/metrics:
    get:
      description: Model accuracy, calibration and SHAP summaries for the eval portal
      responses: { "200": { description: metrics json } }
components:
  schemas:
    PredictRequest:
      type: object
      required: [mother_age, parity, prev_stillbirth, multiple_pregnancy]
      properties:
        mother_age: { type: integer }
        parity: { type: integer }
        prev_stillbirth: { type: boolean }
        multiple_pregnancy: { type: boolean }
        birth_interval_months: { type: integer, nullable: true }
        education: { type: string, nullable: true }
        wealth_quintile: { type: string, nullable: true }
        residence: { type: string, nullable: true }
        region: { type: string, nullable: true }
    PredictResponse:
      type: object
      properties:
        prediction_id: { type: string }
        risk: { type: number }
        risk_band: { type: string, enum: [low, moderate, high] }
        checklist_flag: { type: boolean }
        model_version: { type: string }
        top_drivers:
          type: array
          items:
            type: object
            properties:
              feature: { type: string }
              shap: { type: number }
    RecommendRequest:
      type: object
      required: [prediction_id]
      properties:
        prediction_id: { type: string }
    RecommendResponse:
      type: object
      properties:
        prediction_id: { type: string }
        recommendation: { type: string }
        disclaimer: { type: string }
    Feedback:
      type: object
      required: [prediction_id, verdict]
      properties:
        prediction_id: { type: string }
        verdict: { type: string, enum: [good, viable, unusable] }
        note: { type: string, nullable: true }
