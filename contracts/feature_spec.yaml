# The single source of truth for model inputs.
# Column names match the processed cohort CSVs the team built
# (data/processed/{ke,tz}_{perinatal,perinatal_anc,lbw}.csv).
# Both ml/train.py and the backend build features from this + features.py.
#
# Outcome-time items (delivery_place, birth_weight_g, baby_sex) are present in
# the CSVs but are NOT predictors — they are only known at or after birth.

version: 0.2.0

# Survey design columns (not predictors; needed for weighting and CV).
design:
  caseid: respondent id
  v001: survey cluster (grouped cross-validation keeps a cluster in one fold)
  v005: sample weight (divide by 1,000,000); 'weight' column is the scaled form

# Available in all three cohorts.
features:
  maternal_age:
    label: Mother's age at the pregnancy (years)
    type: int

  maternal_age_at_start:
    label: Mother’s age when the current pregnancy began
    type: int
    derived_from: floor((p3 - p20 - v011) / 12)
    note: antenatal_history_v1 models use this age definition

  prior_pregnancies:
    label: Number of previous pregnancies
    type: int

  prior_live_births:
    label: Number of previous live births (parity)
    type: int

  prior_stillbirth:
    label: Previous stillbirth
    type: bool          # 0 / 1

  prior_loss:
    label: Previous pregnancy loss
    type: bool          # 0 / 1

  preceding_interval_m:
    label: Preceding pregnancy interval (months)
    type: float
    nullable: true      # blank for a first pregnancy
    note: sourced from DHS p11 in the supplied CSVs; interval between pregnancy outcomes, unknown for an ongoing pregnancy

  multiple:
    label: Multiple pregnancy (twins or more)
    type: bool          # 0 / 1

  education:
    label: Highest education level
    type: category
    choices: [No education, Primary, Secondary, Higher]

  wealth_quintile:
    label: Wealth quintile
    type: category
    choices: [Poorest, Poorer, Middle, Richer, Richest]
    note: survey-built index, not a clinic record — review before clinical use

  residence:
    label: Residence
    type: category
    choices: [Urban, Rural]

  region:
    label: Region
    type: category

  told_high_bp:
    label: Ever told has high blood pressure (self-report, exploratory)
    type: bool          # 0.0 / 1.0, may be blank
    nullable: true
    note: proxy only; misses undiagnosed cases. Measured BP is a TZ subsample.

# Extra predictors available only in the *_anc cohorts.
anc_features:
  anc_visits:
    label: Number of ANC visits
    type: float
    nullable: true
  first_anc_month:
    label: Months pregnant at first ANC visit
    type: float
    nullable: true
  bp_measured:
    label: Blood pressure measured at ANC
    type: bool
    nullable: true
  urine_tested:
    label: Urine tested at ANC
    type: bool
    nullable: true
  blood_tested:
    label: Blood tested at ANC
    type: bool
    nullable: true
  iron_tablets:
    label: Given iron tablets at ANC
    type: bool
    nullable: true

# Outcomes (targets, not inputs).
outcomes:
  perinatal_death:
    label: Stillbirth or death in the first 7 days
    type: bool
    cohorts: [perinatal, perinatal_anc]
    components: [stillbirth, early_neonatal_death]
  low_birth_weight:
    label: Birth weight under 2500 g
    type: bool
    cohorts: [lbw]
    derived_from: birth_weight_g
