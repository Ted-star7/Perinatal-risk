services:
  app_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: perinatal_app
    ports: ["5432:5432"]
    volumes:
      - app_db_data:/var/lib/postgresql/data
      - ./db/app:/docker-entrypoint-initdb.d

  api:
    build: ./backend
    environment:
      APP_DB_URL: postgresql+psycopg://app:app@app_db:5432/perinatal_app
      FRONTEND_ORIGIN: http://localhost:4200
      METRICS_SOURCE_URL: https://perinatal-api.onrender.com/metrics #added
    ports: ["8000:8000"]
    volumes:
      # mounted read-only so the backend can build + seed the cohorts on startup
      - ./ml:/code/ml:ro
      - ./contracts:/code/contracts:ro
      - ./data:/code/data:ro
    depends_on: [app_db]

volumes:
  app_db_data:
