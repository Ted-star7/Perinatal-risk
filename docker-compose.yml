services:
  app_db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: perinatal_app
    ports: ["5432:5432"]
    volumes:
      - app_db_data:/var/lib/postgresql/data
      - ./db/app:/docker-entrypoint-initdb.d

  clean_db:
    image: postgres:16
    environment:
      POSTGRES_USER: readonly
      POSTGRES_PASSWORD: readonly
      POSTGRES_DB: perinatal_clean
    ports: ["5433:5432"]
    volumes:
      - clean_db_data:/var/lib/postgresql/data
      - ./db/clean:/docker-entrypoint-initdb.d

  api:
    build: ./backend
    env_file: .env
    environment:
      APP_DB_URL: postgresql+psycopg://app:app@app_db:5432/perinatal_app
      CLEAN_DB_URL: postgresql+psycopg://readonly:readonly@clean_db:5432/perinatal_clean
    ports: ["8000:8000"]
    volumes:
      - ./backend:/code
      - ./contracts:/code/contracts:ro
      - ./ml/models:/code/models:ro
    depends_on: [app_db, clean_db]

volumes:
  app_db_data:
  clean_db_data:
